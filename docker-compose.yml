# ------------------------------------------------------------------
# Compose de produção da gala — container único (API + front estático).
# Persistência: DOIS volumes nomeados (decisão do ADR-0002):
#   gala_data    → /app/data   (SQLite: app.db)
#   gala_uploads → /app/uploads (avatares)
# ⚠ SINGLE WORKER (o hub SSE de eventos vive em memória do processo).
# ------------------------------------------------------------------
services:
  gala:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Dados e uploads em volumes nomeados (sobrevivem ao rebuild)
      DATABASE_URL: sqlite:////app/data/app.db
      UPLOAD_DIR: uploads
      # Secrets vêm do .env DA RAIZ (ao lado deste compose) — veja .env.example.
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env de produção}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env de produção}
      # TLS/wss ficam por conta do proxy de frente (Caddy) — nada aqui.
    # ⚠ ESTA era a peça que faltava: os volumes ABAIXO só existem se forem
    # MONTADOS aqui. Sem estes mounts, o app.db vivia DENTRO do container
    # e todo `docker compose up -d --build` recriava o banco do zero (o
    # mkdir do Dockerfile nasce vazio). Bug real que apagou a gala em prod.
    volumes:
      - gala_data:/app/data
      - gala_uploads:/app/uploads

volumes:
  gala_data:
  gala_uploads:
